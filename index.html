<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI 英语45分 (iOS完美适配版)</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="英语45分">
    <style>
        :root { --primary: #4F46E5; --bg: #F3F4F6; --card: #FFFFFF; --text: #1F2937; --success: #16A34A; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: -10px auto 20px; padding: 0 16px; }
        .card { background: var(--card); border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); position: relative; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 15px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 10px; transition: background 0.2s; }
        .btn:active { background: #4338CA; }
        .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        .tag { display: inline-block; background: #EEF2FF; color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
        .sentence { font-size: 16px; line-height: 1.6; background: #F9FAFB; padding: 14px; border-left: 4px solid var(--primary); border-radius: 0 8px 8px 0; margin: 12px 0; user-select: text; }
        .dialogue-box { background: #F0FDF4; border-left: 4px solid var(--success); padding: 14px; border-radius: 0 8px 8px 0; font-size: 15px; line-height: 1.7; margin: 12px 0; white-space: pre-wrap; }
        
        #word-popup { position: absolute; background: #1F2937; color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; z-index: 1000; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); display: none; max-width: 280px; }
        #word-popup button { background: #4F46E5; color: white; border: none; padding: 4px 8px; border-radius: 4px; margin-top: 6px; cursor: pointer; font-size: 11px; }

        .chat-container { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 10px; padding: 12px; height: 160px; overflow-y: auto; margin-top: 10px; font-size: 14px; }
        .chat-msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; max-width: 85%; }
        .chat-ai { background: #E0E7FF; color: #312E81; }
        .chat-user { background: #DCFCE7; color: #166534; margin-left: auto; }
        .chat-input-row { display: flex; gap: 6px; margin-top: 10px; }
        .chat-input { flex: 1; padding: 8px 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 14px; }

        .api-statusbar { position: fixed; bottom: 0; left: 0; width: 100%; background: #111827; color: #9CA3AF; padding: 10px 16px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 9999; border-top: 1px solid #374151; }
        .api-statusbar span { color: #F3F4F6; font-weight: 600; }
        .refresh-link { color: #818CF8; cursor: pointer; text-decoration: underline; margin-left: 10px; }

        .quiz-opt { display: block; width: 100%; text-align: left; background: #F9FAFB; border: 1px solid #E5E7EB; padding: 14px; margin: 10px 0; border-radius: 10px; cursor: pointer; }
        .quiz-opt:active { background: #EEF2FF; border-color: var(--primary); }

        .hidden { display: none; }
        .api-input { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #D1D5DB; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
        .vocab-item { background: #F3F4F6; padding: 8px 12px; border-radius: 6px; margin-top: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div id="word-popup">
        <div id="popup-content">正在查询...</div>
        <button onclick="saveCurrentWord()">➕ 加入生词本</button>
    </div>

    <div class="header">
        <h2 style="margin:0;">AI 英语45分</h2>
        <p style="margin:6px 0 0; font-size:14px; opacity:0.9;">全功能智能英语学习工作台</p>
    </div>

    <div class="container">
        <!-- 账号打卡与 API 配置 -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span class="tag" id="user-level-tag">当前等级：未测评</span>
                    <h3 style="margin: 8px 0 0;" id="streak-text">连续打卡：0 天</h3>
                </div>
                <button class="btn btn-outline" style="width:auto; padding:6px 12px; font-size:12px;" onclick="startAssessment()">重新测评</button>
            </div>
            <details style="margin-top: 10px; font-size: 12px; color: #6B7280;">
                <summary style="cursor:pointer;">⚙️ API 配置</summary>
                <input type="password" id="api-key-input" class="api-input" placeholder="输入 sk-xxxx 密钥" onchange="saveApiKey()">
            </details>
            <details style="margin-top: 6px; font-size: 12px; color: #4F46E5; font-weight:600;">
                <summary style="cursor:pointer;">📖 我的本地生词本 (<span id="vocab-count">0</span>)</summary>
                <div id="vocab-list" style="max-height: 120px; overflow-y: auto; margin-top: 8px; font-weight:normal;"></div>
            </details>
        </div>

        <!-- 测评模块 -->
        <div id="assessment-card" class="card hidden">
            <h3>🎯 快速测评 (CEFR适配)</h3>
            <div id="quiz-box"><p id="quiz-q" style="font-weight:600;"></p><div id="quiz-options"></div></div>
        </div>

        <!-- 学习主区域 -->
        <div id="learning-card" class="card hidden">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>📅 今日学习计划</h3>
                <button class="btn" style="width:auto; padding:6px 12px; font-size:12px;" onclick="generateDailyContent()">🤖 生成新内容</button>
            </div>
            <hr style="border:none; border-top:1px solid #E5E7EB; margin: 16px 0;">
            
            <div style="margin-bottom: 20px;">
                <span class="tag">01 VOA新闻精听 (12Min)</span>
                <p id="listening-text" class="sentence"></p>
                <button class="btn btn-outline" onclick="speakSingleText('listening-text')">🔊 播放慢速朗读</button>
            </div>

            <div style="margin-bottom: 20px;">
                <span class="tag">02 VOA科普阅读 (13Min)</span>
                <p id="reading-text" class="sentence"></p>
                <button class="btn btn-outline" onclick="speakSingleText('reading-text')">🔊 朗读阅读文章</button>
            </div>

            <div style="margin-bottom: 20px;">
                <span class="tag" style="background:#DCFCE7; color:#15803D;">03 双人场景对话剧本 (10Min) ☕</span>
                <p id="dialogue-text" class="dialogue-box"></p>
                <button class="btn btn-outline" style="border-color:#16A34A; color:#16A34A; margin-bottom:8px;" onclick="playDialogueDualVoice()">🎭 智能男女声交替连贯朗读</button>
                
                <div style="font-weight:600; font-size:13px; color:#166534; margin-top:8px;">💬 实时口语对练（点击输入框，用键盘麦克风说话）：</div>
                <div class="chat-container" id="chat-box">
                    <div class="chat-msg chat-ai">AI 场景助手已就绪！点击下方输入框，使用键盘自带的麦克风即可语音输入！</div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="user-chat-input" class="chat-input" placeholder="点此输入，点击键盘 🎙️ 语音输入..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button class="btn" style="width:auto; margin-top:0; padding:8px 16px;" onclick="sendChat()">发送</button>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <span class="tag">04 影子金句跟读 (5Min)</span>
                <p id="shadowing-text" class="sentence"></p>
                <button class="btn btn-outline" onclick="speakSingleText('shadowing-text')">🎙️ 朗读示范金句</button>
            </div>

            <div>
                <span class="tag">05 打卡记录 (5Min)</span>
                <button class="btn" style="margin-top:12px; font-size:16px;" onclick="doCheckIn()">✅ 完成今日学习打卡</button>
            </div>
        </div>
    </div>

    <!-- 底部常驻 API 余额监控栏 -->
    <div class="api-statusbar" id="api-statusbar">
        <div>状态: <span id="balance-status">未配置 Key</span></div>
        <div>余额: <span id="balance-amount">--</span> <span class="refresh-link" onclick="checkApiBalance()">🔄 刷新</span></div>
    </div>

    <script>
        let userLevel = localStorage.getItem('user_level') || null;
        let streak = parseInt(localStorage.getItem('streak') || '0');
        let apiKey = localStorage.getItem('api_key') || '';
        let vocabBook = JSON.parse(localStorage.getItem('vocab_book') || '[]');
        let currentQuestion = 0; let score = 0;
        let lastSelectedWord = "";

        const questions = [
            {q: "1. Select the correct word: 'Every day, she _____ a cup of green tea.'", opts: ["A. drink", "B. drinks", "C. drinking", "D. drank"], ans: 1},
            {q: "2. The synonyms of 'Crucial' in Beginner English are:", opts: ["A. Small", "B. Very Important", "C. Easy", "D. Fast"], ans: 1},
            {q: "3. Complete: 'TECHNOLOGY has significantly altered _____.'", opts: ["A. communication", "B. communicating", "C. communications", "D. communicated"], ans: 0}
        ];

        const contentDB = {
            "L1": { 
                listening: "VOA news: A small town uses clean energy for the first time.", 
                reading: "A young person started a reading club with friends.", 
                dialogue: "Scene: Ordering Coffee\nA: Hello! What can I get for you today?\nB: Hi! I would like a small iced coffee, please.",
                shadowing: "Practice makes progress. Every small step counts." 
            },
            "L2": { 
                listening: "VOA standard: Solar power technology helps farmers access water.", 
                reading: "Language acquisition works best with consistent comprehensible input.", 
                dialogue: "Scene: Asking for Directions\nA: Excuse me, is there a pharmacy near here?\nB: Yes, go straight for two blocks and turn left.",
                shadowing: "To acquire a language, practice consistently." 
            }
        };

        function initApp() {
            document.getElementById('streak-text').innerText = `连续打卡：${streak} 天`;
            if (apiKey) {
                document.getElementById('api-key-input').value = apiKey;
                checkApiBalance();
            }
            renderVocabBook();
            if (userLevel) {
                document.getElementById('user-level-tag').innerText = `当前等级：${userLevel}`;
                document.getElementById('assessment-card').classList.add('hidden');
                document.getElementById('learning-card').classList.remove('hidden');
                generateDailyContent();
            } else { startAssessment(); }
        }

        async function checkApiBalance() {
            if (!apiKey) {
                document.getElementById('balance-status').innerText = "未配置 Key";
                document.getElementById('balance-amount').innerText = "--";
                return;
            }
            document.getElementById('balance-status').innerText = "查询中...";
            try {
                const response = await fetch("https://api.deepseek.com/user/balance", {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${apiKey}` }
                });
                if (!response.ok) throw new Error("API 校验失败");
                const data = await response.json();
                
                if (data.is_available) {
                    let totalVal = "0.00";
                    if (data.balance_infos && data.balance_infos.length > 0) {
                        totalVal = `${data.balance_infos[0].currency} ${data.balance_infos[0].total_balance}`;
                    }
                    document.getElementById('balance-status').innerText = "正常运行";
                    document.getElementById('balance-amount').innerText = totalVal;
                } else {
                    document.getElementById('balance-status').innerText = "余额不足";
                    document.getElementById('balance-amount').innerText = "￥0.00";
                }
            } catch (err) {
                document.getElementById('balance-status').innerText = "Key 无效或限制";
                document.getElementById('balance-amount').innerText = "Error";
            }
        }

        function startAssessment() { currentQuestion = 0; score = 0; document.getElementById('assessment-card').classList.remove('hidden'); document.getElementById('learning-card').classList.add('hidden'); showQuestion(); }
        function showQuestion() {
            if (currentQuestion >= questions.length) { finishAssessment(); return; }
            let qData = questions[currentQuestion]; document.getElementById('quiz-q').innerText = qData.q;
            let html = ''; qData.opts.forEach((opt, idx) => { html += `<button class="quiz-opt" onclick="answerQuiz(${idx})">${opt}</button>`; });
            document.getElementById('quiz-options').innerHTML = html;
        }
        function answerQuiz(idx) { if (idx === questions[currentQuestion].ans) score++; currentQuestion++; showQuestion(); }
        function finishAssessment() {
            if (score <= 1) userLevel = 'L1 (入门级)';
            else if (score === 2) userLevel = 'L2 (基础级)';
            else userLevel = 'L3 (进阶级)';
            localStorage.setItem('user_level', userLevel);
            document.getElementById('user-level-tag').innerText = `当前等级：${userLevel}`;
            document.getElementById('assessment-card').classList.add('hidden');
            document.getElementById('learning-card').classList.remove('hidden');
            generateDailyContent();
        }

        document.addEventListener('mouseup', function(e) { handleSelection(e); });
        document.addEventListener('touchend', function(e) { handleSelection(e); });

        async function handleSelection(e) {
            const popup = document.getElementById('word-popup');
            const selection = window.getSelection();
            const text = selection.toString().trim();
            if (text.length > 0 && text.length < 30) {
                lastSelectedWord = text;
                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();
                popup.style.top = (rect.bottom + window.scrollY + 8) + 'px';
                popup.style.left = Math.max(10, rect.left + window.scrollX) + 'px';
                popup.style.display = 'block';
                document.getElementById('popup-content').innerText = `🔍 查词: "${text}" ...`;

                if (apiKey) {
                    try {
                        const response = await fetch("https://api.deepseek.com/v1/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                            body: JSON.stringify({
                                model: "deepseek-chat",
                                messages: [{ role: "user", content: `请简明扼要地解释英文单词或短语 "${text}"。格式要求：音标 [xxx] | 中文释义。字数控制在30字以内。` }]
                            })
                        });
                        const resData = await response.json();
                        document.getElementById('popup-content').innerText = `${text}: ${resData.choices[0].message.content.trim()}`;
                    } catch (err) {
                        document.getElementById('popup-content').innerText = `${text}: 网络异常`;
                    }
                } else {
                    document.getElementById('popup-content').innerText = `${text}: [请先配置 API Key]`;
                }
            } else if (!e.target.closest('#word-popup')) {
                popup.style.display = 'none';
            }
        }

        function saveCurrentWord() {
            if (!lastSelectedWord) return;
            const explanation = document.getElementById('popup-content').innerText;
            vocabBook.push({word: lastSelectedWord, info: explanation, time: new Date().toLocaleDateString()});
            localStorage.setItem('vocab_book', JSON.stringify(vocabBook));
            renderVocabBook();
            alert(`已将 "${lastSelectedWord}" 加入生词本！`);
            document.getElementById('word-popup').style.display = 'none';
        }

        function renderVocabBook() {
            document.getElementById('vocab-count').innerText = vocabBook.length;
            let html = '';
            if (vocabBook.length === 0) {
                html = '<div style="color:#9CA3AF; text-align:center;">暂无生词</div>';
            } else {
                vocabBook.slice().reverse().forEach((item, index) => {
                    html += `<div class="vocab-item"><span><b>${item.word}</b> - ${item.info}</span><button onclick="removeVocab(${vocabBook.length - 1 - index})" style="background:#EF4444; color:white; border:none; border-radius:4px; padding:2px 6px; cursor:pointer;">删除</button></div>`;
                });
            }
            document.getElementById('vocab-list').innerHTML = html;
        }

        function removeVocab(index) {
            vocabBook.splice(index, 1);
            localStorage.setItem('vocab_book', JSON.stringify(vocabBook));
            renderVocabBook();
        }

        async function generateDailyContent() {
            let lvlKey = userLevel && userLevel.startsWith('L1') ? 'L1' : 'L2';
            if (apiKey) {
                document.getElementById('listening-text').innerText = "🤖 DeepSeek 正在生成 VOA 听力...";
                document.getElementById('reading-text').innerText = "🤖 DeepSeek 正在生成 VOA 科普...";
                document.getElementById('dialogue-text').innerText = "🤖 正在生成完整多轮双人场景剧本...";
                document.getElementById('shadowing-text').innerText = "🤖 DeepSeek 正在生成跟读金句...";
                try {
                    const response = await fetch("https://api.deepseek.com/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "deepseek-chat",
                            messages: [{
                                role: "user",
                                content: `你是一名资深英语教学专家。请为 CEFR ${userLevel} 等级生成 1 套每日学习卡片，包含：
1. listening: 模仿 VOA 慢速英语风格的短篇听力稿 (约80-100词)
2. reading: 科学阅读 (约100-120词)
3. dialogue: 1个真实生活场景双人对话剧本（包含 Scene 标题，以及交替的 A 和 B 角色的对话，总共 6 到 8 句。格式必须严格为：
Scene: ...
A: ...
B: ...
A: ...
B: ...）
4. shadowing: 1个跟读示范金句

【非常重要】：请只返回合法的 JSON 对象字符串，绝对不要包含任何 markdown 代码块标记，格式如下：
{"listening":"...","reading":"...","dialogue":"Scene: ...\\nA: ...\\nB: ...\\nA: ...\\nB: ...","shadowing":"..."}`
                            }]
                        })
                    });
                    const resData = await response.json();
                    let rawStr = resData.choices[0].message.content.trim();
                    rawStr = rawStr.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
                    const firstBrace = rawStr.indexOf('{');
                    const lastBrace = rawStr.lastIndexOf('}');
                    if (firstBrace !== -1 && lastBrace !== -1) { rawStr = rawStr.substring(firstBrace, lastBrace + 1); }
                    const content = JSON.parse(rawStr);

                    document.getElementById('listening-text').innerText = content.listening;
                    document.getElementById('reading-text').innerText = content.reading;
                    document.getElementById('dialogue-text').innerText = content.dialogue;
                    document.getElementById('shadowing-text').innerText = content.shadowing;
                    
                    document.getElementById('chat-box').innerHTML = `<div class="chat-msg chat-ai">AI 场景助手已就绪！点此输入框并使用键盘自带的 🎙️ 语音输入即可！</div>`;
                    checkApiBalance();
                    return;
                } catch (e) { console.warn("API 动态生成解析失败：", e); }
            }
            let data = contentDB[lvlKey];
            document.getElementById('listening-text').innerText = data.listening;
            document.getElementById('reading-text').innerText = data.reading;
            document.getElementById('dialogue-text').innerText = data.dialogue;
            document.getElementById('shadowing-text').innerText = data.shadowing;
        }

        function playDialogueDualVoice() {
            window.speechSynthesis.cancel();
            const dialogueText = document.getElementById('dialogue-text').innerText;
            const lines = dialogueText.split('\n');
            let sentencesToSpeak = [];
            lines.forEach(line => {
                let cleanLine = line.trim();
                if (!cleanLine || cleanLine.startsWith('Scene:')) return;
                let speaker = 'A';
                let text = cleanLine;
                if (cleanLine.startsWith('A:')) { speaker = 'A'; text = cleanLine.substring(2).trim(); }
                else if (cleanLine.startsWith('B:')) { speaker = 'B'; text = cleanLine.substring(2).trim(); }
                if (text) sentencesToSpeak.push({ speaker: speaker, text: text });
            });
            if (sentencesToSpeak.length === 0) return;

            function speakStep(index) {
                if (index >= sentencesToSpeak.length) return;
                let item = sentencesToSpeak[index];
                let msg = new SpeechSynthesisUtterance(item.text);
                msg.lang = 'en-US';
                msg.rate = 0.85;
                msg.pitch = (item.speaker === 'A') ? 1.0 : 1.3;
                msg.onend = function() { setTimeout(() => speakStep(index + 1), 350); };
                window.speechSynthesis.speak(msg);
            }
            speakStep(0);
        }

        function speakSingleText(elementId) {
            let text = document.getElementById(elementId).innerText;
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 0.85;
            window.speechSynthesis.speak(msg);
        }

        async function sendChat() {
            const inputField = document.getElementById('user-chat-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="chat-msg chat-user">你: ${userText}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            if (!apiKey) {
                chatBox.innerHTML += `<div class="chat-msg chat-ai">AI 助手: 请先在上方配置 API Key！</div>`;
                return;
            }

            chatBox.innerHTML += `<div class="chat-msg chat-ai" id="temp-reply">AI 正在思考回复与纠错...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("[https://api.deepseek.com/v1/chat/completions](https://api.deepseek.com/v1/chat/completions)", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "你是一个英语口语教练和生活场景对话伙伴。请用简单、地道的英文继续对话，并在回复后附带一句简短的中文纠错或地道表达建议。" },
                            { role: "user", content: userText }
                        ]
                    })
                });
                const resData = await response.json();
                document.getElementById('temp-reply').remove();
                
                const aiReply = resData.choices[0].message.content.trim();
                chatBox.innerHTML += `<div class="chat-msg chat-ai">AI 助手: ${aiReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
                let msg = new SpeechSynthesisUtterance(aiReply.split('\n')[0]);
                msg.lang = 'en-US';
                msg.rate = 0.85;
                window.speechSynthesis.speak(msg);

                checkApiBalance();
            } catch (err) {
                document.getElementById('temp-reply').innerText = "AI 响应出错，请检查网络。";
            }
        }

        function saveApiKey() { 
            apiKey = document.getElementById('api-key-input').value.trim(); 
            localStorage.setItem('api_key', apiKey); 
            alert('API 密钥已保存！'); 
            checkApiBalance(); 
            generateDailyContent(); 
        }

        function doCheckIn() { 
            streak++; 
            localStorage.setItem('streak', streak); 
            document.getElementById('streak-text').innerText = `连续打卡：${streak} 天`; 
            alert(`🎉 成功打卡！连续天数：${streak} 天！`); 
        }

        // 初始化运行应用
        initApp();
    </script>
</body>
</html>
